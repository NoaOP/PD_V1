<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mqtt/dist/mqtt.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-rotatedmarker@0.2.0/leaflet.rotatedMarker.min.js"></script>

    <style>
        body { background-color: white; }
        .telemetry-box {
            background: cadetblue;
            color: white;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            border: 2px solid #555;
        }
        .telemetry-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
        }

        .glitter-particle {
            position: relative;
            transform: translate(-50%, -50%);
            line-height: 1;
            font-weight: bold;
            pointer-events: none;
            animation: glitterTwinkle 0.9s ease-in-out infinite alternate;
        }
        @keyframes glitterTwinkle {
            from { opacity: 0.45; transform: translate(-50%, -50%) scale(0.75); filter: brightness(0.9); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1.15); filter: brightness(1.4); }
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-dark bg-dark mb-3">
        <div class="container-fluid justify-content-center">
            <span class="navbar-brand mb-0 h1">Mode Espectador</span>
        </div>
    </nav>

    <div class="container">
        <!-- Panel de Estado -->
        <div class="row mb-3">
            <div class="col-12 text-center">
                <span id="estadoConexion" class="badge bg-warning p-2" style="font-size: 1rem; border: 2px solid #555">Esperant telemetria del pilot...</span>
            </div>
        </div>

        <!-- Telemetría -->
        <div class="row mb-3 justify-content-center">
            <div class="col-6 mb-2">
                <div class="telemetry-box">
                    Altitud<br>
                    <span id="altitudValor" class="telemetry-value">0.00</span> m
                </div>
            </div>
            <div class="col-6 mb-2">
                <div class="telemetry-box">
                    Heading<br>
                    <span id="headingValor" class="telemetry-value">0</span>º
                </div>
            </div>
        </div>


        <!-- Mapa -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-secondary text-white">
                <h5 class="mb-0">Posició en temps real</h5>
            </div>
            <div class="card-body p-0">
                <div id="map" style="height: 500px; width: 100%; border-bottom-left-radius: var(--bs-card-inner-border-radius); border-bottom-right-radius: var(--bs-card-inner-border-radius);"></div>
            </div>
        </div>
    </div>

    <script>
        let map, droneMarker;
        let pol = false;
        let modoBorrar = false;
        let modoTemporal = false;
        let dronePath = [];
        let ultimoPuntoRuta = null;
        let ultimoPuntoBorrador = null;
        let modoArcoiris = false;
        let modoPurpurina = false;
        let contadorArcoiris = 0;
        let contadorPurpurina = 0;
        let lineaTrazoActual = null;
        let elementosDibujo = [];
        let estiloRutaActual = { color: 'red', weight: 3, formato: 'solid' };
        const coloresArcoiris = ['#ff0000', '#ff7f00', '#ffff00', '#00ff00', '#0000ff', '#4b0082', '#9400d3'];

        let capaPuntosJuego = L.layerGroup();
        let puntosJuegoActivos = [];
        const CENTRO_JUEGO = { lat: 41.276389, lng: 1.988694 };
        let juegoActivo = false;

        function inicializarMapa() {
            const latInicial = 41.276478;
            const lonInicial = 1.988571;
            map = L.map('map').setView([latInicial, lonInicial], 19);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 22 }).addTo(map);

            const droneIcon = L.icon({
                iconUrl:'https://images.vexels.com/media/users/3/215129/isolated/preview/f98ff00414055616a9675d5d4aed6a9d-icono-de-trazo-de-vista-superior-de-drone-quadcopter.png',
                iconSize: [30,30], iconAnchor: [15,15]
            });
            droneMarker = L.marker([latInicial, lonInicial], { icon: droneIcon }).addTo(map);
            capaPuntosJuego.addTo(map);
        }

        window.onload = inicializarMapa;

        const client = mqtt.connect('ws://dronseetac.upc.edu:8000', {
            clean: true, keepalive: 60,
            clientId: 'spectator_' + Math.random().toString(16).substr(2, 8),
            username: 'dronsEETAC', password: 'mimara1456.'
        });

        client.on('connect', function () {
            console.log('Espectador conectado al broker');
            client.subscribe('Grup99/autopilotServiceDemo/+/telemetryInfo');
            client.subscribe('Grup99/autopilotServiceDemo/+/syncVisuals');
            client.subscribe('Grup99/autopilotServiceDemo/+/clearMap');
            client.subscribe('Grup99/autopilotServiceDemo/+/gameStart');
            client.subscribe('Grup99/autopilotServiceDemo/+/gameEnd');
            client.subscribe('Grup99/autopilotServiceDemo/+/pointDeleted');
            client.subscribe('Grup99/autopilotServiceDemo/+/paintOn');
            client.subscribe('Grup99/autopilotServiceDemo/+/paintOff');
        });

        client.on('message', function (topic, message) {

            if (topic.endsWith('/clearMap')) {
            console.log("Recibida orden de limpiar mapa");
            elementosDibujo.forEach(elemento => {
                if (elemento.layer && map.hasLayer(elemento.layer)) {
                    map.removeLayer(elemento.layer);
                }
            });
            elementosDibujo = [];
            dronePath = [];
            ultimoPuntoRuta = null;
            ultimoPuntoBorrador = null;
            lineaTrazoActual = null;
            contadorArcoiris = 0;
            contadorPurpurina = 0;
            return;
            }

            if (topic.endsWith('/syncVisuals')) {
                const config = JSON.parse(message.toString());
                pol = config.pol;
                estiloRutaActual = config.estilo;
                modoArcoiris = config.arcoiris;
                modoPurpurina = config.purpurina;
                modoBorrar = config.borrar;
                modoTemporal = config.temporal;
                lineaTrazoActual = null;
                ultimoPuntoRuta = null;

                if (!pol) ultimoPuntoRuta = null;
                if (!modoBorrar) ultimoPuntoBorrador = null;
            }

            if (topic.endsWith('/pointDeleted')) {
                const datosPunto = JSON.parse(message.toString());

                puntosJuegoActivos = puntosJuegoActivos.filter(punto => {
                    const diffLat = Math.abs(punto.lat - datosPunto.lat);
                    const diffLng = Math.abs(punto.lng - datosPunto.lng);

                    if (diffLat < 0.00001 && diffLng < 0.00001) {
                        if (capaPuntosJuego.hasLayer(punto.marker)) {
                            capaPuntosJuego.removeLayer(punto.marker);
                        }
                        return false;
                    }
                    return true;
                });
            }

            if (topic.endsWith('/gameStart')) {
                const figura = message.toString();
                generarFiguraJuego(figura);
                juegoActivo = true;

                document.getElementById('estadoConexion').className = "badge bg-success p-2";
                document.getElementById('estadoConexion').innerText = "S'esta jugant (" + figura.toUpperCase() + ")";
            }

            if (topic.endsWith('/gameEnd')) {
                limpiarJuegoEspectador();
            }

            if (topic.endsWith('/telemetryInfo')) {
                if (!juegoActivo) {
                    document.getElementById('estadoConexion').className = "badge bg-success p-2";
                    document.getElementById('estadoConexion').innerText = "Veient l’emissió en directe";
                }

                const data = JSON.parse(message.toString());
                let alt = parseFloat(data.alt !== undefined ? data.alt : data.altitude);
                document.getElementById('altitudValor').innerText = isNaN(alt) ? "0.00" : alt.toFixed(2);
                document.getElementById('headingValor').innerText = data.heading || "0";

                const lat = data.lat || data.latitude;
                const lon = data.lng || data.lon || data.longitude;

                if (lat && lon) {
                    const nuevaPos = [lat, lon];
                    droneMarker.setLatLng(nuevaPos);
                    droneMarker.setRotationAngle(data.heading || 0);
                    map.panTo(nuevaPos);

                    if (juegoActivo) {
                        let dronLatLng = L.latLng(parseFloat(lat), parseFloat(lon));
                        puntosJuegoActivos = puntosJuegoActivos.filter(punto => {
                            let puntoLatLng = L.latLng(parseFloat(punto.lat), parseFloat(punto.lng));
                            if (dronLatLng.distanceTo(puntoLatLng) < 3.0) {
                                if (capaPuntosJuego.hasLayer(punto.marker)) {
                                    capaPuntosJuego.removeLayer(punto.marker);
                                }
                                return false;
                            }
                            return true;
                        });
                    }



                    if (modoBorrar) {
                        if (ultimoPuntoBorrador) borrarConLineaTransparente(ultimoPuntoBorrador, nuevaPos);
                        ultimoPuntoBorrador = nuevaPos;
                        ultimoPuntoRuta = null;
                    }

                    else if (pol) {
                        dronePath.push(nuevaPos);

                        if (['solid', 'dash-short'].includes(estiloRutaActual.formato)) {
                            if (ultimoPuntoRuta) {
                                añadirSegmentoLinea(ultimoPuntoRuta, nuevaPos);
                            }
                        }

                        // Ponemos el 10 para que entre simbolos sea la misma distancia que en el modo piloto
                        if (estiloRutaActual.formato === 'dots' && dronePath.length % 10 === 0) añadirPuntoDecorativo(nuevaPos);
                        if (estiloRutaActual.formato === 'stars' && dronePath.length % 10 === 0) añadirEstrellaDecorativa(nuevaPos);
                        if (estiloRutaActual.formato === 'hearts' && dronePath.length % 10 === 0) añadirCorazonDecorativo(nuevaPos);

                        // Para la purpurina
                        if (modoPurpurina) {
                            contadorPurpurina++;
                            if (contadorPurpurina % 5 === 0)
                                añadirPurpurinaDecorativa(nuevaPos, data.heading || 0);
                        }

                        ultimoPuntoRuta = nuevaPos;
                    }
                }
            }
            if (topic.endsWith('/paintOn')) {
                pol = true;
                ultimoPuntoRuta = null;
                lineaTrazoActual = null;
            }

            if (topic.endsWith('/paintOff')) {
                pol = false;
                ultimoPuntoRuta = null;
                lineaTrazoActual = null;
            }
        });

        function crearPuntoJuego(lat, lng) {
            let marker = L.circleMarker([lat, lng], {
                radius: 5,
                color: 'red',
                fillColor: '#ff4444',
                fillOpacity: 1
            }).addTo(capaPuntosJuego);

            puntosJuegoActivos.push({ lat: lat, lng: lng, marker: marker });
        }

        function generarFiguraJuego(tipo) {
            capaPuntosJuego.clearLayers();
            puntosJuegoActivos = [];
            let centro = CENTRO_JUEGO;
            const mLat = 1 / 111320;
            const mLng = 1 / (111320 * Math.cos(centro.lat * Math.PI / 180));
            let radio = 12.5;

            if (tipo === 'Cercle') {
                for (let i = 0; i < 24; i++) {
                    let angulo = (i * 360 / 24) * (Math.PI / 180);
                    crearPuntoJuego(
                        centro.lat + (radio * Math.cos(angulo) * mLat),
                        centro.lng + (radio * Math.sin(angulo) * mLng)
                    );
                }
            }
            else if (tipo === 'Quadrat') {
                let lado = radio;
                for(let i=0; i<6; i++) crearPuntoJuego(centro.lat + lado*mLat, centro.lng + (lado - i*(lado*2/6))*mLng);
                for(let i=0; i<6; i++) crearPuntoJuego(centro.lat + (lado - i*(lado*2/6))*mLat, centro.lng - lado*mLng);
                for(let i=0; i<6; i++) crearPuntoJuego(centro.lat - lado*mLat, centro.lng - (lado - i*(lado*2/6))*mLng);
                for(let i=0; i<6; i++) crearPuntoJuego(centro.lat - (lado - i*(lado*2/6))*mLat, centro.lng + lado*mLng);
            }
            else if (tipo === 'Estrella') {
                let vertices = [];
                for (let i = 0; i < 10; i++) {
                    let r = (i % 2 === 0) ? 17.5 : 6.25;
                    let angulo = (i * 360 / 10) * (Math.PI / 180);
                    vertices.push({
                        lat: centro.lat + (r * Math.cos(angulo) * mLat),
                        lng: centro.lng + (r * Math.sin(angulo) * mLng)
                    });
                }
                for (let i = 0; i < vertices.length; i++) {
                    let v1 = vertices[i];
                    let v2 = vertices[(i + 1) % vertices.length];
                    crearPuntoJuego(v1.lat, v1.lng);
                    crearPuntoJuego(v1.lat + (v2.lat - v1.lat)*0.33, v1.lng + (v2.lng - v1.lng)*0.33);
                    crearPuntoJuego(v1.lat + (v2.lat - v1.lat)*0.66, v1.lng + (v2.lng - v1.lng)*0.66);
                }
            }
        }

        function limpiarJuegoEspectador() {
            juegoActivo = false;
            capaPuntosJuego.clearLayers();
            puntosJuegoActivos = [];
            document.getElementById('estadoConexion').className = "badge bg-success p-2";
            document.getElementById('estadoConexion').innerText = "Veient l’emissió en directe";
        }



        function guardarElementoDibujo(elemento) {
            elementosDibujo.push(elemento);
            if (modoTemporal) {
                setTimeout(() => {
                    if (map && map.hasLayer(elemento.layer)) {
                        map.removeLayer(elemento.layer);
                    }
                    elementosDibujo = elementosDibujo.filter(e => e !== elemento);
                }, 10000);
            }
        }

        function obtenerOpcionesLinea() {
            let opciones = {
                color: estiloRutaActual.color,
                weight: estiloRutaActual.weight,
                lineCap: 'butt',
                lineJoin: 'round',
                renderer: L.canvas()
            };

            if (estiloRutaActual.formato === 'dash-short') {
                // Aumentamos a 6, 6 para que el hueco sea claro
                opciones.dashArray = '6, 6';
            }
            return opciones;
        }



        function obtenerColorDibujo() {
            if (modoArcoiris) {
                const color = coloresArcoiris[contadorArcoiris % coloresArcoiris.length];
                contadorArcoiris++;
                return color;
            }
            return estiloRutaActual.color;
        }



        function añadirSegmentoLinea(pos1, pos2) {
            let opciones = obtenerOpcionesLinea();
            opciones.color = obtenerColorDibujo();

            // Si està activat arcoíris i línia discontínua curta,
            // dibuixem un segment sí i un segment no
            if (modoArcoiris === true && estiloRutaActual.formato === 'dash-short') {
                let cicle = dronePath.length % 8;

                if (cicle === 0 || cicle === 1 || cicle === 2) {
                    const linea = L.polyline([pos1, pos2], {
                        color: opciones.color,
                        weight: opciones.weight,
                        lineCap: 'butt',
                        renderer: L.canvas()
                    }).addTo(map);

                    guardarElementoDibujo({
                        tipo: 'linea',
                        layer: linea,
                        puntos: [pos1, pos2]
                    });
                }

                return;
            }

            // Si està activat arcoíris però NO és discontínua,
            // fem segments separats perquè cada tros tingui un color diferent
            if (modoArcoiris === true) {

                const linea = L.polyline([pos1, pos2], {
                    ...opciones,
                    renderer: L.canvas()
                }).addTo(map);

                guardarElementoDibujo({
                    tipo: 'linea',
                    layer: linea,
                    puntos: [pos1, pos2]
                });

                return;
            }

            // Línia normal o discontínua curta sense arcoíris
            if (lineaTrazoActual === null) {

               lineaTrazoActual = L.polyline([pos1, pos2], {
                    ...opciones,
                    renderer: L.canvas()
                }).addTo(map);

                guardarElementoDibujo({
                    tipo: 'lineaContinua',
                    layer: lineaTrazoActual,
                    puntos: [pos1, pos2]
                });
            } else {
                lineaTrazoActual.addLatLng(pos2);

                const elemento = elementosDibujo.find(e => e.layer === lineaTrazoActual);
                if (elemento) {
                    elemento.puntos.push(pos2);
                }
            }
        }


        function añadirPuntoDecorativo(posicion) {
            const color = obtenerColorDibujo();
            const punto = L.circleMarker(posicion, {
                                                radius: estiloRutaActual.weight * 1.4,
                                                color: color,
                                                fillColor: color,
                                                fillOpacity: 1,
                                                weight: 1
                                                }).addTo(map);
            guardarElementoDibujo({ tipo: 'decoracion', layer: punto, posicion: posicion });
        }

        function añadirEstrellaDecorativa(posicion) {
            const tamano = estiloRutaActual.weight * 5;
            const color = obtenerColorDibujo();
            const estrella = L.divIcon({
                className: '',
                html: `<div style="color: ${color}; font-size: ${tamano}px; line-height: ${tamano}px; width: ${tamano}px; height: ${tamano}px; text-align: center; transform: translate(-50%, -50%);">★</div>`, iconSize: [0, 0] });
            const marker = L.marker(posicion, {
                icon: estrella,
                interactive: false
                }).addTo(map);
            guardarElementoDibujo({ tipo: 'decoracion', layer: marker, posicion: posicion });
        }

        function añadirCorazonDecorativo(posicion) {
            const tamano = estiloRutaActual.weight * 5;
            const color = obtenerColorDibujo();
            const corazon = L.divIcon({
                className: '',
                html: `<div style="color: ${color}; font-size: ${tamano}px; line-height: ${tamano}px; width: ${tamano}px; height: ${tamano}px; text-align: center; transform: translate(-50%, -50%);">♥</div>`, iconSize: [0, 0] });
            const marker = L.marker(posicion, {
                icon: corazon,
                interactive: false
                }).addTo(map);
            guardarElementoDibujo({
                tipo: 'decoracion',
                layer: marker,
                posicion: posicion });
        }

        function añadirPurpurinaDecorativa(posicion, heading) {
            const color = obtenerColorDibujo();   // si arcoíris està activat, agafa el color que toca; si no, el triat
            const grosor = estiloRutaActual.weight;

            const puntoBase = map.latLngToLayerPoint(L.latLng(posicion[0], posicion[1]));
            const headingRad = heading * Math.PI / 180;

            // El grossor controla l'amplada de la cua, no la mida de cada partícula
            const cantidad = Math.max(3, Math.round(grosor*2));
            const distanciaBase = 5 + grosor * 0.8;
            const longitudCola = 5 + grosor * 1.2;
            const anchoCola = Math.max(1.2, grosor * 0.3);

            for (let i = 0; i < cantidad; i++) {
                const atras = distanciaBase + Math.random() * longitudCola;
                const lateral = (Math.random() - 0.5) * anchoCola;

                const x = puntoBase.x - Math.sin(headingRad) * atras + Math.cos(headingRad) * lateral;
                const y = puntoBase.y + Math.cos(headingRad) * atras + Math.sin(headingRad) * lateral;

                const puntoPurpurina = map.layerPointToLatLng(L.point(x, y));

                // Partícules petites i brillants
                const tamano = 2 + grosor * 0.35 + Math.random() * 0.8;
                const opacidad = 0.6 + Math.random() * 0.3;
                const brillo1 = 3;
                const brillo2 = 7;

                const simbolos = ['✦', '✧', '•'];
                const simbolo = simbolos[Math.floor(Math.random() * simbolos.length)];

                const particula = L.marker(puntoPurpurina, {
                    icon: L.divIcon({
                        className: '',
                        html: `<div class="glitter-particle"
                                    style="
                                        color: ${color};
                                        font-size: ${tamano}px;
                                        opacity: ${opacidad};
                                        -webkit-text-stroke: 0.1px white;
                                        text-shadow:
                                            0 0 ${brillo1}px ${color},
                                            0 0 ${brillo2}px ${color},
                                            0 0 ${brillo2}px ${color};
                                        animation-delay: ${Math.random() * 0.8}s;
                                    ">
                                    ${simbolo}
                                </div>`,
                        iconSize: [0, 0],
                        iconAnchor: [0, 0]
                    }),
                    interactive: false
                }).addTo(map);

                guardarElementoDibujo({
                    tipo: 'decoracion',
                    layer: particula,
                    posicion: [puntoPurpurina.lat, puntoPurpurina.lng]
                });
            }
        }


        function borrarConLineaTransparente(posAnterior, posActual) {
            const radioBorradoPx = Math.max(3, estiloRutaActual.weight * 1.5);
            const gomaA = map.latLngToLayerPoint(L.latLng(posAnterior));
            const gomaB = map.latLngToLayerPoint(L.latLng(posActual));

            elementosDibujo = elementosDibujo.filter(elemento => {
                let borrar = false;

                if (elemento.tipo === 'linea' || elemento.tipo === 'lineaContinua') {
                    for (let i = 0; i < elemento.puntos.length - 1; i++) {
                        const p1 = map.latLngToLayerPoint(L.latLng(elemento.puntos[i]));
                        const p2 = map.latLngToLayerPoint(L.latLng(elemento.puntos[i+1]));
                        if (distanciaSegmentoSegmento(gomaA, gomaB, p1, p2) <= radioBorradoPx) {
                            borrar = true;
                            break;
                        }
                    }
                }
                else if (elemento.tipo === 'decoracion') {
                    const p = map.latLngToLayerPoint(L.latLng(elemento.posicion));
                    if (distanciaPuntoSegmento(p, gomaA, gomaB) <= radioBorradoPx) borrar = true;
                }

                if (borrar) {
                    map.removeLayer(elemento.layer);
                    if (elemento.layer === lineaTrazoActual) lineaTrazoActual = null;
                    return false;
                }
                return true;
            });
        }

        function distanciaPuntoSegmento(p, a, b) {
            const dx = b.x - a.x, dy = b.y - a.y;
            if (dx === 0 && dy === 0) return Math.sqrt((p.x - a.x) ** 2 + (p.y - a.y) ** 2);
            let t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / (dx * dx + dy * dy);
            t = Math.max(0, Math.min(1, t));
            return Math.sqrt((p.x - (a.x + t * dx)) ** 2 + (p.y - (a.y + t * dy)) ** 2);
        }

        function distanciaSegmentoSegmento(a1, a2, b1, b2) {
            if (segmentosSeCortan(a1, a2, b1, b2)) return 0;
            return Math.min(
                distanciaPuntoSegmento(a1, b1, b2), distanciaPuntoSegmento(a2, b1, b2),
                distanciaPuntoSegmento(b1, a1, a2), distanciaPuntoSegmento(b2, a1, a2)
            );
        }

        function segmentosSeCortan(a1, a2, b1, b2) {
            const orientacion = (p, q, r) => (q.y - p.y) * (r.x - q.x) - (q.x - p.x) * (r.y - q.y);
            return (orientacion(a1, a2, b1) * orientacion(a1, a2, b2) < 0) && (orientacion(b1, b2, a1) * orientacion(b1, b2, a2) < 0);
        }
