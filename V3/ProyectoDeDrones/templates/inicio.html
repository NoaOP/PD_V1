<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #343a40;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .card-menu {
            background-color: cadetblue;
            border: 2px solid cadetblue;
            border-radius: 15px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: white;
        }
        .card-menu:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            color: white;
        }
        .icono {
            font-size: 2rem;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container text-center">
        <h1 class="mb-5 fw-bold">Escull el mode de vol</h1>

        <div class="row justify-content-center gap-4">

            <!-- boto Piloto -->
            <div class="col-md-5">
                <a href="/pilot" class="card p-5 card-menu text-center d-block">
                    <div class="icono">Mode Pilot</div>
                </a>
            </div>

            <!-- Botón Espectador -->
            <div class="col-md-5">
                <a href="/spectator" class="card p-5 card-menu text-center d-block">
                    <div class="icono">Mode Espectador</div>
                </a>
            </div>

        </div>
    </div>

</body>
</html>
