<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mqtt/dist/mqtt.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-rotatedmarker@0.2.0/leaflet.rotatedMarker.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
</head>

<style>
    .boton {
        font-size: 18px;
        padding: 10px;
        margin: 5px 0;
        cursor: pointer;
        background-color: cadetblue;
        color: white;
        border: 2px solid #555;
        border-radius: 5px;
        width: 100%;
        transition: background-color 0.3s;
    }

    .boton-verde { background-color: #4CAF50 !important; color: white !important; }
    .boton-amarillo { background-color: #FFD700 !important; color: black !important; }
    .boton-blau { background-color: cadetblue ; }
    .boton-rojo { background-color: #f44336; }

    .panel-controles {
        display: flex;
        justify-content: center;
        gap: 20px;
        flex-wrap: wrap;
        margin-top: 20px;
        width: 100%;
    }

    .direction, .direction2 {
        display: grid;
        grid-template-rows: 100px 100px 100px;
        grid-template-columns: 100px 100px 100px;
        text-align: center;
        margin: 0;
    }

    .box {
        background: purple;
        border: 3px solid #555;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 18px;
        margin: 2px;
        cursor: pointer;
        border-radius: 8px;
    }

    .spacer { width: 100px; height: 100px; }
</style>

<body>
    <nav class="nav nav-pills nav-justified bg-dark p-2">
        <button class="nav-link active text-white" onclick="abrirTab(event, 'tab-control')">Control</button>
        <button class="nav-link text-white" onclick="abrirTab(event, 'tab-mapa')">Mapa</button>
        <button class="nav-link text-white" onclick="abrirTab(event, 'tab-settings')">Ajustes</button>
        <button class="nav-link text-white" onclick="abrirTab(event, 'tab-video')">Video</button>
    </nav>

    <div id="tab-control" class="tab-content container mt-3">


        <!-- 🔵Esto para poner los botones de CONECTAR el simulador o al MAVProxy🔵 -->
       <div class="d-flex gap-2 align-items-center mb-2 w-100">
            <button id="botonConectarMAV" class="boton boton-blau w-50" onclick="conectarMAV()">Conectar (MAVProxy)</button>
            <button id="botonConectarSim" class="boton boton-blau w-50" onclick="conectarSim()">Conectar (Simulador)</button>
       </div>


        <!-- 🔵 Altura + despegar (segunda fila, orden vertical, ancho completo)-->
        <div class="d-flex gap-2 align-items-center mb-2">
            <button id="botonDespegar" class="boton" onclick="despegarDron()">Despegar</button>
            <input type="number" id="altura" class="form-control " style="border: 2px solid #555;height: 50px;margin-bottom: 0; box-sizing: border-box;" placeholder="Altura en metros">
        </div>

        <div class="d-flex gap-2">
            <button id="botonAterrizar" class="boton" onclick="aterrizarDron()">Aterrizar Dron</button>
            <button id="botonRTL" class="boton" onclick="rtlDron()">RTL (Volver a casa)</button>
        </div>

        <button id="botonMicrofono" class="boton boton-blau" onclick="toggleVoz()"> Control por Voz</button>

        <div class="d-flex gap-2">
            <div class="mt-3 mb-3 p-3 text-center text-white w-50" style="background-color: cadetblue; border-radius: 5px; border: 2px solid #555;">
                <label for="headingSlider" class="form-label" style="font-size: 18px;">
                    Grados (Heading): <span id="headingValor">0</span>º
                </label>
                <input type="range" class="form-range w-100" id="headingSlider" min="0" max="360" step="5" value="0" onchange="cambiarHeading(this.value)">
            </div>

            <div class="mt-3 mb-3 p-3 text-center text-white w-50" style="background-color: cadetblue; border-radius: 5px; border: 2px solid #555;">
                <label for="speedSlider" class="form-label" style="font-size: 18px;">
                    Velocidad: <span id="speedValor">0</span>m/s
                </label>
                <input type="range" class="form-range w-100" id="speedSlider" min="0" max="10" step="1" value="0" onchange="cambiarSpeed(this.value)">
            </div>
        </div>

        <div class="panel-controles">
            <div class="direction">
                <div onclick="moverDron('NorthWest')" class="box">NW</div>
                <div onclick="moverDron('North')" class="box">N</div>
                <div onclick="moverDron('NorthEast')" class="box">NE</div>
                <div onclick="moverDron('West')" class="box">W</div>
                <div onclick="moverDron('Stop')" class="box">Stop</div>
                <div onclick="moverDron('East')" class="box">E</div>
                <div onclick="moverDron('SouthWest')" class="box">SW</div>
                <div onclick="moverDron('South')" class="box">S</div>
                <div onclick="moverDron('SouthEast')" class="box">SE</div>
            </div>

            <div class="direction2">
                <div class="spacer"></div>
                <div onclick="moverDron('Forward')" class="box">Forward</div>
                <div class="spacer"></div>
                <div onclick="moverDron('Left')" class="box">Left</div>
                <div onclick="moverDron('Stop')" class="box">Stop</div>
                <div onclick="moverDron('Right')" class="box">Right</div>
                <div class="spacer"></div>
                <div onclick="moverDron('Back')" class="box">Back</div>
                <div class="spacer"></div>
            </div>

            <div class="direction2">
                <div class="spacer"></div>
                <div onclick="moverDron('Up')" class="box">Up</div>
                <div class="spacer"></div>
                <div class="spacer"></div>
                <div onclick="moverDron('Stop')" class="box">Stop</div>
                <div class="spacer"></div>
                <div class="spacer"></div>
                <div onclick="moverDron('Down')" class="box">Down</div>
                <div class="spacer"></div>
            </div>
        </div>

        <div id="telemetriaDiv" style="font-size: 24px; text-align: center; width:100%; margin-top: 20px;">
            <p><strong>Altitud:</strong> <span id="altitudValor">0</span> m</p>
        </div>
    </div>

    <div id="tab-mapa" class="tab-content container mt-3" style="display:none">
        <h2 class="text-center">Posición GPS</h2>

        <div id="map" style="height: 400px; background: #eee; border-radius: 10px;"> </div>


        <div class="d-flex gap-2 align-items-center mb-2 w-100">

            <!-- <span id="indicador-vuelo" class="badge boton-rojo" style="font-size: 1.1rem; padding: 10px; border: 2px solid #555; border-radius: 5px; width: 100%; text-align: center;">  -->
            <span id="indicador-vuelo" class="badge boton-rojo d-flex align-items-center justify-content-center w-50" style="font-size: 1.1rem; padding: 10px 20px; transition: all 0.5s ease; border: 2px solid #555; border-radius: 5px; height: 50px;">
                <span id="texto-vuelo">Wait to fly</span>
            </span>

            <button id="botonPintar" class="boton boton-blau w-50" onclick="pintar()" style="border: 2px solid #555; border-radius: 5px; height: 50px;">Pintar</button>
        </div>


        <div class="d-flex justify-content-around align-items-center mt-4" style="background: #333; border-radius: 15px; padding: 20px;">
            <div id="joystick-container" style="width: 150px; height: 150px; position: relative; background: #444; border-radius: 50%;">
                <p style="color: white; position: absolute; bottom: -30px; width: 100%; text-align: center;">Movimiento</p>
            </div>

            <div class="d-flex flex-column gap-2" style="width: 100px;">
                <button onclick="moverDron('Up')" class="box">Up</button>
                <button onclick="moverDron('Stop')" class="box">STOP</button>
                <button onclick="moverDron('Down')" class="box">Down</button>
            </div>
        </div>
    </div>

    <div id="tab-settings" class="tab-content container mt-3" style="display:none">
        <h2 class="text-center">Ajustes del Mapa</h2>

        <div class="card p-4 mt-3" style="background-color: white; border: 2px solid cadetblue;">
            <div class="mb-4">
                <label for="colorTrazo" class="form-label fw-bold">Color de la trayectoria:</label>
                <input type="color" class="form-control form-control-color w-100" id="colorTrazo" value="#ff0000" title="Selecciona un color" onchange="actualizarEstiloRuta()">
            </div>

            <div class="mb-4">
                <label for="grosorTrazo" class="form-label fw-bold">Grosor del trazo: <span id="grosorValor">3</span>px</label>
                <input type="range" class="form-range" id="grosorTrazo" min="1" max="10" step="1" value="3" onchange="actualizarEstiloRuta()">
            </div>

            <div class="mt-4">
                <button id="botonTriangulo" class="boton boton-blau" onclick="hacerTriangulo()">Triángulo</button>
            </div>

        </div>
    </div>

    <div id="tab-video" class="tab-content container mt-3" style="display:none">
        <h2 class="text-center">Streaming en tiempo real</h2>
        <div class="d-flex gap-2">
            <button id="botonVideo" class="boton boton-blau mb-3" onclick="iniciarStreaming()">Iniciar Video</button>
            <button id="botonStopVideo" class="boton boton-blau mb-3" onclick="detenerStreaming()">Detener Video</button>
        </div>
        <video id="videoRemote" autoplay playsinline muted style="width: 100%; height: auto; min-height: 300px; border-radius: 10px; background: black;"></video>
    </div>

    <script>

        let map, droneMarker, pc;
        let dronePath = [];
        let pol = false;
        let tramoActual = null;
        let ultimoPuntoRuta = null;
        let estiloRutaActual = {
            color: 'red',
            weight: 3
        };

        const configuration = {iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]};

        function inicializarMapa() {
            const latInicial = 41.276478;
            const lonInicial = 1.988571;

            map = L.map('map').setView([latInicial, lonInicial], 19);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 22,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);

            const droneIcon = L.icon({
                iconUrl:'https://images.vexels.com/media/users/3/215129/isolated/preview/f98ff00414055616a9675d5d4aed6a9d-icono-de-trazo-de-vista-superior-de-drone-quadcopter.png',
                iconSize: [30,30],
                iconAnchor: [15,15],
                popupAnchor: [0, -15]
            });

            droneMarker = L.marker([latInicial, lonInicial], {
                icon: droneIcon,
                rotationAngle: 0,
                rotationOrigin: 'center center'
            }).addTo(map);

            tramoActual = L.polyline([], estiloRutaActual).addTo(map);

            window.map = map;
        }

        window.onload = inicializarMapa;

        // Funció per pintar o no la trajectoria
        function pintar(){
            if (pol === true) {
                pol = false;
                document.getElementById("botonPintar").innerText = "Pintar (OFF)";
                document.getElementById("botonPintar").classList.remove('boton-blau', 'boton-verde');

            } else {
                pol = true;
                document.getElementById("botonPintar").innerText = "Pintar (ON)";
                document.getElementById("botonPintar").classList.add('boton-verde');
            }
        }


        // Nos conectamos a un broker o a dronseetac o a hivemq
        const client = mqtt.connect('ws://dronseetac.upc.edu:8000', {
            clean: false,
            keepalive: 60,
            clientId: 'webapp_' + Math.random().toString(16).substr(2, 8),
            reconnectPeriod: 1000,
            username: 'dronsEETAC',
            password: 'mimara1456.'
        });

        client.on('connect', function () {
            console.log('Conectado al broker MQTT');
            client.subscribe('Grup21/autopilotServiceDemo/mobileFlask/#');
        });

        client.on('message', function (topic, message) {
            console.log("Mensaje recibido en:", topic, "Contenido:", message.toString());

            if (topic === "Grup21/autopilotServiceDemo/mobileFlask/connected") {

                console.log("El dron confirma conexión. Pidiendo telemetría...");

                const botonDespegar = document.getElementById('botonDespegar');
                botonDespegar.classList.remove('boton-verde','boton-amarillo');

                const btnMAV = document.getElementById('botonConectarMAV');
                btnMAV.classList.remove('boton-amarillo', 'boton-blau');
                btnMAV.classList.add('boton-verde');

                const btnSim = document.getElementById('botonConectarSim');
                btnSim.classList.remove('boton-amarillo', 'boton-blau');
                btnSim.classList.add('boton-verde');

                client.publish('mobileFlask/autopilotServiceDemo/startTelemetry');
            }

            // Escuchar los datos de telemetría
            if (topic === "Grup21/autopilotServiceDemo/mobileFlask/telemetryInfo") {

                const btnMAV = document.getElementById('botonConectarMAV');
                const btnSim = document.getElementById('botonConectarSim');

                if (btnMAV.classList.contains('boton-amarillo') || btnSim.classList.contains('boton-amarillo')) {
                    btnMAV.classList.remove('boton-amarillo', 'boton-blau');
                    btnMAV.classList.add('boton-verde');
                    btnMAV.innerText = "Connected";

                    btnSim.classList.remove('boton-amarillo', 'boton-blau');
                    btnSim.classList.add('boton-verde');
                    btnSim.innerText = "Connected";
                }

                const data = JSON.parse(message.toString());

                const indicador = document.getElementById('indicador-vuelo');
                const texto = document.getElementById('texto-vuelo');
                const joystickCont = document.getElementById('joystick-container');

                if (data.state === 'flying') {
                    texto.innerText = "Ready to fly";
                    indicador.classList.remove('boton-rojo', 'boton-amarillo');
                    indicador.classList.add('boton-verde');
                    joystickCont.style.pointerEvents = "auto";
                } else if (data.state === 'takingOff' || data.state === 'armed') {
                    texto.innerText = "Getting ready";
                    indicador.classList.remove('boton-rojo', 'boton-verde');
                    indicador.classList.add('boton-amarillo');
                    joystickCont.style.pointerEvents = "none";
                } else {
                    texto.innerText = "Wait to fly";
                    indicador.classList.remove('boton-verde', 'boton-amarillo');
                    indicador.classList.add('boton-rojo');
                    joystickCont.style.pointerEvents = "none";
                }

                const lat = data.lat || data.latitude;
                const lon = data.lng || data.lon || data.longitude;

                if (lat && lon) {
                    const nuevaPos = [lat, lon];

                    droneMarker.setLatLng(nuevaPos);
                    map.panTo(nuevaPos);

                    // Dibujar el rastro si esta activo
                    if (pol === true) {
                        dronePath.push(nuevaPos);

                        if (!tramoActual) {
                            tramoActual = L.polyline([], estiloRutaActual).addTo(map);
                        }

                        if (tramoActual.getLatLngs().length === 0 && ultimoPuntoRuta) {
                            tramoActual.addLatLng(ultimoPuntoRuta);
                        }

                        tramoActual.addLatLng(nuevaPos);
                        ultimoPuntoRuta = nuevaPos;
                    } else {
                        tramoActual = null;
                        ultimoPuntoRuta = nuevaPos;
                    }

                }

                const heading = data.heading || 0;
                droneMarker.setRotationAngle(heading);
                droneMarker.setRotationOrigin('center center');

                let alt = parseFloat(data.alt !== undefined ? data.alt : data.altitude);
                if (isNaN(alt)) {
                    alt = 0.0;
                }

                const estado = data.state;

                if (estado === "flying") {
                    const botonDespegar = document.getElementById('botonDespegar');
                    botonDespegar.classList.remove('boton-amarillo');
                    botonDespegar.classList.add('boton-verde');
                }

                document.getElementById("altitudValor").innerText = alt.toFixed(2);

                if (data.state !== "flying" || data.flightMode === "LAND") {
                    const botonAterrizar = document.getElementById('botonAterrizar');
                    const botonDespegar = document.getElementById('botonDespegar');

                    if (botonAterrizar.classList.contains('boton-amarillo')) {
                        if (alt < 0.5) {
                            botonAterrizar.classList.remove('boton-amarillo');
                            botonAterrizar.classList.add('boton-verde');
                            botonDespegar.classList.remove('boton-verde','boton-amarillo');

                            setTimeout(() => {
                                botonAterrizar.classList.remove('boton-verde');
                            }, 2000);
                        }
                    }
                }

                if (data.state !== "flying" || data.flightMode === "RTL") {
                    const botonRTL = document.getElementById('botonRTL');
                    const botonDespegar = document.getElementById('botonDespegar');

                    if (botonRTL.classList.contains('boton-amarillo')) {
                        if (alt < 0.5) {
                            botonRTL.classList.remove('boton-amarillo');
                            botonRTL.classList.add('boton-verde');
                            botonDespegar.classList.remove('boton-verde','boton-amarillo');

                            setTimeout(() => {
                                botonRTL.classList.remove('boton-verde');
                            }, 2000);
                        }
                    }
                }
            }

            if (topic === "Grup21/autopilotServiceDemo/mobileFlask/videoOffer") {

                const data = JSON.parse(message.toString());
                console.log("Oferta de video recibida del dron");
                recibirVideo(data.offer);
            }

            if (topic === "Grup21/autopilotServiceDemo/mobileFlask/iceCandidate") {

                const data = JSON.parse(message.toString());
                if (pc && data.candidate) {
                    pc.addIceCandidate(new RTCIceCandidate(data.candidate));
                }
            }
        });

        function despegarDron() {
            const altura = document.getElementById('altura').value;

            if (altura) {
                client.publish('mobileFlask/autopilotServiceDemo/arm_takeOff', altura);
                document.getElementById('botonDespegar').classList.add('boton-amarillo');
            } else {
                alert("Por favor, ingrese una altura válida.");
            }
        }

        function aterrizarDron() {
            client.publish('mobileFlask/autopilotServiceDemo/Land');
            document.getElementById('botonAterrizar').classList.add('boton-amarillo');
        }

        function rtlDron() {
            client.publish('mobileFlask/autopilotServiceDemo/RTL');
            document.getElementById('botonRTL').classList.add('boton-amarillo');
        }

        function hacerTriangulo() {
            client.publish('mobileFlask/autopilotServiceDemo/triangle', 'start');
        }

        function cambiarHeading(valor) {
            document.getElementById('headingValor').innerText = valor;
            client.publish('mobileFlask/autopilotServiceDemo/changeHeading', valor.toString());
        }

        function cambiarSpeed(valor) {
            document.getElementById('speedValor').innerText = valor;
            client.publish('mobileFlask/autopilotServiceDemo/changeNavSpeed', valor.toString());
        }

        function moverDron(direction) {
            client.publish('mobileFlask/autopilotServiceDemo/go', direction);
        }

        function abrirTab(evt, nombreTab) {
            const contenidos = document.getElementsByClassName("tab-content");

            for (let i = 0; i < contenidos.length; i++) {
                contenidos[i].style.display = "none";
            }

            const links = document.getElementsByClassName("nav-link");

            for (let i = 0; i < links.length; i++) {
                links[i].classList.remove("active");
            }

            document.getElementById(nombreTab).style.display = "block";
            evt.currentTarget.classList.add("active");

            if (nombreTab === 'tab-mapa' && window.map) {
                setTimeout(() => { window.map.invalidateSize(); }, 200);
            }
        }

        let vozActiva = false;
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();

        recognition.lang = 'es-ES';
        recognition.continuous = true;
        recognition.interimResults = false;

        function toggleVoz() {
            const btn = document.getElementById('botonMicrofono');

            if (!vozActiva) {
                vozActiva = true;
                recognition.start();
                btn.innerText = "Listening... (Click para apagar)";
                btn.classList.replace('boton-blau', 'boton-verde');
            } else {
                vozActiva = false;
                recognition.stop();
                btn.innerText = "Control por Voz";
                btn.classList.replace('boton-verde', 'boton-blau');
            }
        }

        recognition.onend = () => {
            if (vozActiva) {
                console.log("Reinicio automático del micrófono...");
                recognition.start();
            }
        };

        recognition.onresult = (event) => {
            const command = event.results[event.results.length - 1][0].transcript.toLowerCase();
            console.log("Comando recibido:", command);

            if (command.includes("despega")) {
                let inputAlt = document.getElementById('altura');
                if(!inputAlt.value) inputAlt.value = 2;
                despegarDron();
            }
            else if (command.includes("aterriza")) {
                aterrizarDron();
            }
            else if (command.includes("norte")) {
                moverDron('North');
            }
            else if (command.includes("sur")) {
                moverDron('South');
            }
            else if (command.includes("este")) {
                moverDron('East');
            }
            else if (command.includes("oeste")) {
                moverDron('West');
            }
            else if (command.includes("para") || command.includes("detente") || command.includes("stop")) {
                moverDron('Stop');
            }
            else if (command.includes("casa") || command.includes("vuelve") || command.includes("retorna a casa")) {
                rtlDron();
            }
            else if (command.includes("sube") || command.includes("arriba")) {
                moverDron('Up');
            }
            else if (command.includes("baja") || command.includes("abajo")) {
                moverDron('Down');
            }
            else if (command.includes("izquierda") ) {
                moverDron('Left');
            }
            else if (command.includes("derecha") ) {
                moverDron('Right');
            }
            else if (command.includes("adelante") ) {
                moverDron('Forward');
            }
            else if (command.includes("atrás") ) {
                moverDron('Back');
            }
        };

        recognition.onerror = (event) => {
            console.error("Error en reconocimiento:", event.error);
            if (event.error === 'network') alert("Error de red en el reconocimiento de voz.");
        };

        async function recibirVideo(offer) {
            pc = new RTCPeerConnection(configuration);

            pc.ontrack = (event) => {
                console.log("Track recibido");

                const videoRemote = document.getElementById('videoRemote');
                videoRemote.srcObject = event.streams[0];

                const btn = document.getElementById('botonVideo');
                btn.innerText = "Streaming Activo";
                btn.classList.replace('boton-amarillo', 'boton-verde');

                const btnStopVideo = document.getElementById('botonStopVideo');
                btnStopVideo.classList.remove('boton-verd', 'boton-amarillo');
                btnStopVideo.classList.add('boton-blau');
            };

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    client.publish('mobileFlask/autopilotServiceDemo/iceCandidate', JSON.stringify({
                        candidate: event.candidate
                    }));
                }
            };

            await pc.setRemoteDescription(new RTCSessionDescription(offer));

            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);

            client.publish('mobileFlask/autopilotServiceDemo/videoAnswer', JSON.stringify({
                answer: answer
            }));
        }

        function iniciarStreaming() {
            const btn = document.getElementById('botonVideo');

            btn.innerText = "Conectando...";
            btn.classList.replace('boton-blau', 'boton-amarillo');

            client.publish('mobileFlask/autopilotServiceDemo/startVideo', 'start');
        }

        function detenerStreaming() {
            if (pc) {
                pc.close();
                pc = null;

                const videoRemote = document.getElementById('videoRemote');
                videoRemote.srcObject = null;

                const btnIniciar = document.getElementById('botonVideo');
                btnIniciar.innerText = "Iniciar Video";
                btnIniciar.classList.remove('boton-verde', 'boton-amarillo');
                btnIniciar.classList.add('boton-blau');

                client.publish('mobileFlask/autopilotServiceDemo/stopVideo', 'stop');

                console.log("Streaming detenido");
            }
        }

        function conectarMAV() {
            console.log("Conectando a MAVProxy...");

            client.publish('mobileFlask/autopilotServiceDemo/connect');

            const btn = document.getElementById('botonConectarMAV');
            btn.innerText = "Conectando...";
            btn.classList.remove('boton-blau', 'boton-verde');
            btn.classList.add('boton-amarillo');
        }

        function conectarSim() {
            console.log("Conectando al Simulador (TCP)...");

            client.publish('mobileFlask/autopilotServiceDemo/Simulacion', '2,0');

            const btn = document.getElementById('botonConectarSim');
            btn.innerText = "Conectando Sim...";
            btn.classList.remove('boton-blau', 'boton-verde');
            btn.classList.add('boton-amarillo');
        }

        let joystick;

        function initJoystick() {
            if (joystick) joystick.destroy();

            const options = {
                zone: document.getElementById('joystick-container'),
                mode: 'static',
                position: { left: '50%', top: '50%' },
                color: 'cadetblue',
                size: 120,
                threshold: 0.1,
                restJoystick: true
            };

            joystick = nipplejs.create(options);

            let lastTime = 0;
            const interval = 50;

            joystick.on('move', function (evt, data) {
                const now = Date.now();

                if (now - lastTime < interval) return;

                lastTime = now;

                if (data.angle) {
                    let angle = data.angle.degree;
                    let finalDir = "";

                    if (angle > 67.5 && angle <= 112.5) finalDir = "North";
                    else if (angle > 22.5 && angle <= 67.5) finalDir = "NorthEast";
                    else if (angle <= 22.5 || angle > 337.5) finalDir = "East";
                    else if (angle > 292.5 && angle <= 337.5) finalDir = "SouthEast";
                    else if (angle > 247.5 && angle <= 292.5) finalDir = "South";
                    else if (angle > 202.5 && angle <= 247.5) finalDir = "SouthWest";
                    else if (angle > 157.5 && angle <= 202.5) finalDir = "West";
                    else if (angle > 112.5 && angle <= 157.5) finalDir = "NorthWest";

                    if (finalDir) {
                        client.publish('mobileFlask/autopilotServiceDemo/go', finalDir);
                    }
                }
            });

            joystick.on('end', function () {
                client.publish('mobileFlask/autopilotServiceDemo/go', 'Stop');
            });
        }

        const originalAbrirTab = abrirTab;

        abrirTab = function(evt, nombreTab) {
            originalAbrirTab(evt, nombreTab);

            if (nombreTab === 'tab-mapa') {
                setTimeout(initJoystick, 300);
            }
        };

        function actualizarEstiloRuta() {
            const nuevoColor = document.getElementById('colorTrazo').value;
            const nuevoGrosor = parseInt(document.getElementById('grosorTrazo').value);

            document.getElementById('grosorValor').innerText = nuevoGrosor;

            if (estiloRutaActual.color === nuevoColor && estiloRutaActual.weight === nuevoGrosor) {
                return;
            }

            estiloRutaActual = {
                color: nuevoColor,
                weight: nuevoGrosor
            };

            tramoActual = L.polyline([], estiloRutaActual).addTo(map);

            if (ultimoPuntoRuta) {
                tramoActual.addLatLng(ultimoPuntoRuta);
            }
        }

    </script>
